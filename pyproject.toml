[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dop_2026"
version = "0.1"
description = "Agent-based prey-predator simulation"
requires-python = ">=3.11"
dependencies = ["matplotlib"]

[project.optional-dependencies]
notebook = ["ipykernel"]

[project.scripts]
symulacja = "src.prey_predator_sim.simulation:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
